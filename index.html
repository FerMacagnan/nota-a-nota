<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nota a Nota</title>
<meta name="description" content="Controle das compras de mercado a partir das notas fiscais.">
<meta name="theme-color" content="#0A7558">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nota a Nota">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authView" hidden></div>

<div id="appView" hidden>
  <header class="top"><div class="wrap">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 2h16v22l-2.7-1.8L15.6 24 13 22.2 10.4 24l-2.7-1.8L5 24z" fill="var(--accent)"/><path d="M9 8h8M9 12h8M9 16h5" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>
      Nota a Nota
    </div>
    <div class="row"><span class="sub" id="syncState"></span><button class="acct" id="acctBtn" type="button" aria-label="Minha conta">?</button></div>
  </div></header>

  <main class="wrap" id="main" aria-live="polite"></main>

  <button class="fab" id="fab" type="button" aria-label="Adicionar nota fiscal">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nota
  </button>

  <nav class="bottom" aria-label="Seções"><div class="wrap" id="nav"></div></nav>
</div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
